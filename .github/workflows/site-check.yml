name: Site check

# Opens every page of kingconnecttx.com in a real browser after each update and fails
# if a page breaks, spills off a phone screen, has a dead link, or the calculator,
# lead form or chat stops working. GitHub emails you when a run fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .github/site-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the site
        run: npx playwright test
        env:
          CI: 'true'
      - name: Save the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-report
          path: |
            .github/site-check/playwright-report
            .github/site-check/test-results
          retention-days: 14
